<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ऑफ़लाइन • सरपंच सेतु (Sarpanch Setu)</title>
  <style>
    :root {
      --primary: #1b4332;
      --bg: #f8f6f0;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --border: #e2dacd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(27, 67, 50, 0.08);
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #fef3c7;
      color: #d97706;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    h1 { font-size: 1.4rem; color: var(--primary); margin-bottom: 0.5rem; }
    p { font-size: 0.95rem; color: var(--muted); line-height: 1.6; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
    }
    .helpline-box {
      margin-top: 2rem;
      border-top: 1px dashed var(--border);
      padding-top: 1.5rem;
      text-align: left;
      font-size: 0.85rem;
    }
    .helpline-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .helpline-item a {
      color: #b91c1c;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>इंटरनेट कनेक्शन उपलब्ध नहीं है</h1>
    <p>
      आप इस समय ऑफ़लाइन हैं। नई समस्या दर्ज करने अथवा स्थिति जांचने हेतु इंटरनेट की आवश्यकता होगी।
    </p>

    <button class="btn" onclick="window.location.reload()">
      पुनः प्रयास करें (Reload Page)
    </button>

    <div class="helpline-box">
      <strong>आपातकालीन प्रत्यक्ष कॉल:</strong>
      <div class="helpline-item" style="margin-top: 0.75rem;">
        <span>राजस्थान संपर्क हेल्पलाइन:</span>
        <a href="tel:181">181</a>
      </div>
      <div class="helpline-item">
        <span>एम्बुलेंस (आपातकालीन):</span>
        <a href="tel:108">108</a>
      </div>
      <div class="helpline-item">
        <span>महिला सुरक्षा हेल्पलाइन:</span>
        <a href="tel:1090">1090</a>
      </div>
    </div>
  </div>
</body>
</html>
